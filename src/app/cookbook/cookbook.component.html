<div class="body">
    <tab-container>
        <tab-content [tabTitle]="'Recipe Builder'">
            <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()" class="form">
                <div class="field">
                    <label>Recipe Title</label>
                    <div class="label-with-warning">
                        <img src="assets/icons/warning-red-20px.png" [tooltip]="this.errors.titleTooltip" height="20" width="20"
                            class="warning-icon" [ngClass]="{'show': !!errors.title.length}">
                        <input type="text" formControlName="title" (input)="onTitleChange()">
                    </div>
                </div>
                <div class="field">
                    <label>Who are you?</label>
                    <div class="label-with-warning">
                        <img src="assets/icons/warning-red-20px.png" [tooltip]="this.errors.usernameTooltip" height="20" width="20"
                            class="warning-icon" [ngClass]="{'show': !!errors.username.length}">
                        <input type="text" formControlName="submittedBy" (input)="onUserChange()">
                    </div>
                </div>
                <div class="field">
                    <label>Recipe Type</label>
                    <select (change)="onRecipeTypeChange($event)" formControlName="recipeType">
                        <option *ngFor="let type of recipeTypes" [ngValue]="type">{{type}}</option>
                    </select>
                </div>
                <div class="field">
                    <div formArrayName="ingredients">
                        <div *ngFor="let ing of ingredients.controls; index as i">
                            <div formGroupName="{{i}}" class="ingredient label-with-warning">
                                <img src="assets/icons/warning-red-20px.png"
                                    [tooltip]="(this.errors.ingredientsTooltip[i] !== undefined && this.errors.ingredientsTooltip[i].length)
                                        ? this.errors.ingredientsTooltip[i] : ''"
                                    height="20" width="20" class="warning-icon"
                                    [ngClass]="{'show': this.errors.ingredientsTooltip[i] !== undefined && this.errors.ingredientsTooltip[i].length}">    
                                <input type="text" formControlName="amount" (input)="onAmountChange($event)">
                                <select (change)="onUnitChange($event)" formControlName="units">
                                    <option *ngFor="let type of measurementTypes" [ngValue]="type">{{type}}</option>
                                </select>
                                <input type="text" formControlName="item" (input)="onItemChange($event)">
                                <div *ngFor="let err of getKeys(ing.errors)">err{{err}}</div>
                                <button (click)="removeIngredient(i)">Remove</button>
                            </div>
                        </div>
                        <div class="label-with-warning">
                            <img src="assets/icons/warning-red-20px.png" class="warning-icon"
                            tooltip="Oops! Did you forget your ingredients?"
                            height="20" width="20" 
                            [ngClass]="{'show': submitClicked && !ingredients.controls.length}">    
                            <button type="button" (click)="addIngredient()">Add Ingredient</button>
                        </div>
                    </div>
                </div>
                <div class="field">
                    <label>Instructions</label>
                    <div class="label-with-warning">
                        <img src="assets/icons/warning-red-20px.png" [tooltip]="this.errors.titleTooltip" height="20" width="20"
                        class="warning-icon" [ngClass]="{'show': !!errors.title.length}">
                        <textarea formControlName="instructions" rows="5" cols="80"></textarea>
                    </div>
                </div>
                <div class="field">
                    <label>Optionally, add a picture</label>
                    <input class="picture" type="file" accept="image/*" formControlName="pic" 
                        (change)="onImageUpload($event)" (cancel)="onImageCancel($event)">
                </div>
                <ng-container *ngIf="recipeForm.controls.pic.value" (click)="null">
                    <div class="pic-date">
                        <div class="field">
                            <label>Picture month</label>
                            <select formControlName="picMonth">
                                <option *ngFor="let month of monthList" [ngValue]="month">{{month}}</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Picture year</label>
                            <input type="number" formControlName="picYear" min="1900" [max]="curDate.getFullYear()" pattern="\d*">
                        </div>
                    </div>
                    <div class="field">
                        <label>Caption</label>
                        <input type="text" formControlName="picCaption">
                    </div>
                </ng-container>
                <div *ngIf="submitClicked && this.errorsExist">Please fix your errors, then try submitting again.</div>
                <button type="submit">Submit</button>
            </form>

        </tab-content>
        <tab-content [tabTitle]="'Preview'" [onTabClick]="onPreviewClick">
            <div>
                <iframe *ngIf="pdfSrc" [src]="pdfSrc" id="main-iframe" style="width: 100%; height: 100%; z-index: 2; border: 2px black;"></iframe>
            </div>
        </tab-content>
    </tab-container>
</div>
